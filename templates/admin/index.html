{% extends "admin/index.html" %}
{% load i18n static %}

{% block content %}
<!-- Fleet showcase banner -->
<div style="
    background: linear-gradient(90deg, #0f172a 0%, #1e3a8a 100%);
    border-radius: 20px;
    padding: 28px 32px;
    margin-bottom: 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    overflow: hidden;
    position: relative;
    box-shadow: 0 8px 32px rgba(15, 23, 42, 0.4);
">
    <div style="position: relative; z-index: 1;">
        <span style="font-size: 11px; font-weight: 800; letter-spacing: 3px; text-transform: uppercase; color: #60a5fa;">Fleet Control Center</span>
        <h2 style="font-size: 26px; font-weight: 900; color: white; margin: 6px 0 4px; letter-spacing: -0.5px;">
            RidKari Admin Dashboard
        </h2>
        <p style="font-size: 13px; color: #94a3b8; margin: 0; max-width: 440px;">
            Manage your entire vehicle fleet, customer reservations, inspection reports, and service schedules from one place.
        </p>
    </div>
    <div style="display: flex; gap: 10px; flex-shrink: 0;">
        <img src="https://images.unsplash.com/photo-1594502184342-2e12f877aa73?auto=format&fit=crop&w=200&q=70"
             style="width: 110px; height: 72px; object-fit: cover; border-radius: 12px; opacity: 0.8; border: 2px solid rgba(255,255,255,0.1);" alt="SUV">
        <img src="https://images.unsplash.com/photo-1560958089-b8a1929cea89?auto=format&fit=crop&w=200&q=70"
             style="width: 110px; height: 72px; object-fit: cover; border-radius: 12px; opacity: 0.8; border: 2px solid rgba(255,255,255,0.1);" alt="Electric">
        <img src="https://images.unsplash.com/photo-1584345604476-8ec5e12e42dd?auto=format&fit=crop&w=200&q=70"
             style="width: 110px; height: 72px; object-fit: cover; border-radius: 12px; opacity: 0.8; border: 2px solid rgba(255,255,255,0.1);" alt="Sports">
    </div>
</div>

<!-- Original admin app panels continue -->
{{ block.super }}
{% endblock %}
