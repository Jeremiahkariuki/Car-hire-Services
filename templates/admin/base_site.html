{% extends "admin/base.html" %}
{% load static %}

{% block extrastyle %}
{{ block.super }}
<link rel="stylesheet" href="{% static 'admin/css/custom_admin.css' %}">
{% endblock %}

{% block branding %}
<div id="site-name">
    <a href="{% url 'admin:index' %}" style="display: flex; align-items: center; gap: 12px; text-decoration: none; padding: 6px 0;">
        <img src="{% static 'images/ridekari_logo_dark.png' %}" alt="RideKari" style="height: 32px; width: auto; object-fit: contain;">
        <span style="font-size: 11px; font-weight: 700; color: #60a5fa; text-transform: uppercase; letter-spacing: 1.5px; border-left: 1px solid rgba(255,255,255,0.2); padding-left: 12px;">Admin Control</span>
    </a>
</div>
{% endblock %}

{% block userlinks %}
<a href="/" target="_blank" style="display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 8px; background: rgba(37, 99, 235, 0.2); border: 1px solid rgba(59, 130, 246, 0.3); color: #60a5fa; font-weight: 700; font-size: 11px; text-decoration: none; margin-right: 12px;">
    <span>🌐</span> Live Site ↗
</a>
{{ block.super }}
{% endblock %}
